# The answer surface over ANY Java project. Every view takes `project`: a repository URL
# (`https://github.com/acme/shop@main`; the default branch without `@ref`) or a folder (under the
# world's data/, or a name in the owner's mounted workspace). The project is read when the view
# runs; nothing is stored. No view names a framework.

- name: ProjectOverview
  description: >-
    What a project is: the commit read, its modules, types, settings, dependencies.
    The first call for any project, and proof the key resolves. Counts only: `types` is the Java
    types the source declares (not Kotlin or other JVM languages), `dependencies` the distinct
    resolved artifacts below the modules.
  params:
    project: { type: string, required: true, description: "Project key: a repository URL, optionally @ref, or a folder." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:HAS_MODULE]->(m:ProjectModule)
    WITH p, collect(m.coordinates) AS modules, head(collect(m.project)) AS read
    OPTIONAL MATCH (p)-[:DECLARES_TYPE]->(t:JavaProjectType)
    WITH p, modules, read, count(t) AS types
    OPTIONAL MATCH (p)-[:HAS_SETTING]->(s:ProjectSetting)
    WITH p, modules, read, types, count(s) AS settings
    OPTIONAL MATCH (p)-[:DEPENDS_ON]->(d:ProjectDependency) WHERE d.depth > 0
    RETURN read AS project, modules, size(modules) AS moduleCount, types, settings,
           count(DISTINCT d.coordinates) AS dependencies

- name: ProjectModules
  description: >-
    The modules of the project's Maven build, with coordinates and packaging.
    Each with its parent and the directory it lives in ('' is the root). Only modules the build's
    reactor reads; up to 300.
  params:
    project: { type: string, required: true, description: "Project key." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:HAS_MODULE]->(m:ProjectModule)
    RETURN m.module AS module, m.coordinates AS coordinates, m.packaging AS packaging,
           m.parent AS parent, m.name AS name
    ORDER BY module LIMIT 300

- name: AnnotatedWith
  description: >-
    Everything in the project's own source carrying one annotation, by simple name.
    For example `Transactional`, `Deprecated` or `Test`: what it is on, its attributes, and a link to
    the line. Only Java source the project declares, not its dependencies' jars; the name matches
    exactly as written (no package, no `@`); up to 500.
  params:
    project: { type: string, required: true, description: "Project key." }
    annotation: { type: string, required: true, description: "The annotation's simple name, e.g. Transactional." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:HAS_ANNOTATION]->(a:JavaProjectAnnotation {name: $annotation})
    RETURN a.targetKind AS on, coalesce(a.owner + '#' + a.targetName, a.targetName) AS target,
           a.attributes AS attributes, a.path AS file, a.line AS line, a.link AS link
    ORDER BY file, line LIMIT 500

- name: UsesOfPackage
  description: >-
    Which files import from a package or class, by prefix.
    For example `javax.`, `org.junit.Assert` or `com.acme.legacy`: the way to find every place a
    library or an old API is still used. Only import statements in Java source; a fully qualified
    name written inline without an import is not seen. Up to 500.
  params:
    project: { type: string, required: true, description: "Project key." }
    prefix: { type: string, required: true, description: "Package or class prefix, e.g. javax.persistence" }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:HAS_IMPORT]->(i:JavaProjectImport)
    WHERE i.name STARTS WITH $prefix
    RETURN i.name AS imported, i.path AS file, i.line AS line, i.module AS module, i.link AS link
    ORDER BY imported, file LIMIT 500

- name: SettingsNamed
  description: >-
    Where a configuration key (by prefix) is set in .properties and YAML files.
    With each value, file, document and line. Only what the project's own files set, not defaults a
    framework applies or environment overrides; up to 500.
  params:
    project: { type: string, required: true, description: "Project key." }
    prefix: { type: string, required: true, description: "Key prefix, e.g. server. or spring.datasource" }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:HAS_SETTING]->(s:ProjectSetting)
    WHERE s.name STARTS WITH $prefix
    RETURN s.name AS key, s.value AS value, s.fileName AS file, s.document AS document,
           s.line AS line, s.path AS path, s.link AS link
    ORDER BY key, path LIMIT 500

- name: WhyIsItHere
  description: >-
    Why an artifact is in the resolved dependency tree: every path to it.
    By artifactId, or groupId:artifactId, from each module down, with the version Maven settled on.
    Only the resolved runtime classpath (compile and runtime scope): a test-scoped or excluded
    artifact does not appear. Up to 100 paths, shallowest first.
  params:
    project: { type: string, required: true, description: "Project key." }
    artifact: { type: string, required: true, description: "artifactId, or groupId:artifactId." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:DEPENDS_ON]->(d:ProjectDependency)
    WHERE d.artifactId = $artifact OR d.groupId + ':' + d.artifactId = $artifact
    RETURN d.module AS module, d.coordinates AS resolved, d.scope AS scope, d.depth AS depth,
           d.path AS path
    ORDER BY depth LIMIT 100

- name: VersionOf
  description: >-
    Which version of an artifact the project resolves, and which its BOMs manage.
    And which modules resolve it: the answers that disagree when a version override is pinning
    something old. Does not say which BOM or parent pinned the managed version.
  params:
    project: { type: string, required: true, description: "Project key." }
    artifact: { type: string, required: true, description: "artifactId, or groupId:artifactId." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:MANAGES]->(v:ProjectManagedVersion)
    WHERE v.artifactId = $artifact OR v.groupId + ':' + v.artifactId = $artifact
    WITH p, collect(DISTINCT v.version) AS managed
    OPTIONAL MATCH (p)-[:DEPENDS_ON]->(d:ProjectDependency)
    WHERE d.artifactId = $artifact OR d.groupId + ':' + d.artifactId = $artifact
    RETURN managed, collect(DISTINCT d.version) AS resolved, collect(DISTINCT d.module) AS inModules

- name: DependencyTree
  description: >-
    One module's resolved dependency tree, in Maven's order, with depth and scope.
    `module` is the module's directory ('' for the root). Only that one module, and only its runtime
    classpath (compile and runtime scope, not test); up to 2000 entries.
  params:
    project: { type: string, required: true, description: "Project key." }
    module: { type: string, default: "", description: "Module directory; '' is the root." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:DEPENDS_ON]->(d:ProjectDependency {module: $module})
    RETURN d.depth AS depth, d.coordinates AS coordinates, d.scope AS scope, d.optional AS optional,
           d.parent AS via
    LIMIT 2000

# NAVIGATION: project → module → package → file. Read from the project's files, so it covers every
# JVM language in the build, not only the Java the type and member joins parse.

- name: ModuleSources
  description: >-
    Each Maven module with its count of source files, main and test, and languages.
    The first step down from a project: pick a module, then ask ModulePackages. Only .java, .kt,
    .kts, .groovy and .scala files under a `src/` folder are counted; up to 500 modules.
  params:
    project: { type: string, required: true, description: "Project key." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:HAS_MODULE]->(m:ProjectModule)
    OPTIONAL MATCH (p)-[:HAS_FILE]->(f:ProjectFile)
    WHERE f.module = m.module AND f.extension IN ['java', 'kt', 'kts', 'groovy', 'scala'] AND ('/' + f.path) CONTAINS '/src/'
    WITH m, f, split(split('/' + f.path, '/src/')[1], '/')[0] AS sourceSet
    RETURN m.module AS module, m.coordinates AS coordinates, m.packaging AS packaging, m.name AS name,
           count(CASE WHEN sourceSet = 'main' THEN 1 END) AS mainFiles,
           count(CASE WHEN sourceSet = 'test' THEN 1 END) AS testFiles,
           [x IN collect(DISTINCT f.extension) WHERE x IS NOT NULL] AS languages
    ORDER BY mainFiles DESC, module LIMIT 500

- name: ModulePackages
  description: >-
    The packages of one Maven module, by source set, with file counts and languages.
    A package is the directory under `src/<set>/<language>/`. Only .java, .kt, .kts, .groovy and
    .scala files; the module matches exactly; up to 3000 packages.
  params:
    project: { type: string, required: true, description: "Project key." }
    module: { type: string, default: "", description: "The module's directory, as ModuleSources gives it; '' for the root." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:HAS_FILE]->(f:ProjectFile)
    WHERE f.module = $module AND f.extension IN ['java', 'kt', 'kts', 'groovy', 'scala'] AND ('/' + f.path) CONTAINS '/src/'
    WITH f, split(split('/' + f.path, '/src/')[1], '/') AS parts
    WITH parts[0] AS sourceSet, f,
         reduce(s = '', x IN parts[2..size(parts) - 1] | CASE WHEN s = '' THEN x ELSE s + '.' + x END) AS package
    RETURN package, sourceSet, count(f) AS files, collect(DISTINCT f.extension) AS languages
    ORDER BY sourceSet, package LIMIT 3000

- name: PackageFiles
  description: >-
    The source files of one package in one module and source set, with links.
    Each with a link to it on the repository's host. Only .java, .kt, .kts, .groovy and .scala files;
    module, package and source set match exactly; up to 2000.
  params:
    project: { type: string, required: true, description: "Project key." }
    module: { type: string, default: "", description: "The module's directory; '' for the root." }
    package: { type: string, required: true, description: "Dotted package name, as ModulePackages gives it; '' for the default package." }
    sourceSet: { type: string, default: "main", description: "main or test." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:HAS_FILE]->(f:ProjectFile)
    WHERE f.module = $module AND f.extension IN ['java', 'kt', 'kts', 'groovy', 'scala'] AND ('/' + f.path) CONTAINS '/src/'
    WITH f, split(split('/' + f.path, '/src/')[1], '/') AS parts
    WITH f, parts[0] AS sourceSet,
         reduce(s = '', x IN parts[2..size(parts) - 1] | CASE WHEN s = '' THEN x ELSE s + '.' + x END) AS package
    WHERE package = $package AND sourceSet = $sourceSet
    RETURN f.fileName AS file, f.extension AS language, f.path AS path, f.link AS link
    ORDER BY file LIMIT 2000

- name: FilesByExtension
  description: >-
    What a project is written in: its files counted by extension.
    With how many are under src/main and src/test and how many modules hold them. Every file is
    counted, not only JVM source, so a build with TypeScript, Python or templates beside its Kotlin
    and Java shows them. Files with no extension are left out; the top 80 extensions.
  params:
    project: { type: string, required: true, description: "Project key." }
  cypher: |
    MATCH (p:JavaProject {key: $project})-[:HAS_FILE]->(f:ProjectFile)
    WHERE f.extension IS NOT NULL AND f.extension <> ''
    WITH f.extension AS extension, f,
         CASE WHEN ('/' + f.path) CONTAINS '/src/test/' THEN 'test' WHEN ('/' + f.path) CONTAINS '/src/main/' THEN 'main' ELSE 'other' END AS place
    RETURN extension, count(f) AS files,
           count(CASE WHEN place = 'main' THEN 1 END) AS mainFiles,
           count(CASE WHEN place = 'test' THEN 1 END) AS testFiles,
           count(DISTINCT f.module) AS modules
    ORDER BY files DESC LIMIT 80
